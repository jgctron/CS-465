<div class="container">
    <h2>Register</h2>
    <form (ngSubmit)="onRegisterSubmit()">
      <div role="alert" *ngIf="formError" class="alert alert-danger">{{ formError }}</div>
      
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" class="form-control" id="name" [(ngModel)]="credentials.name" name="name" placeholder="Enter your name" required>
      </div>
      
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" class="form-control" id="email" [(ngModel)]="credentials.email" name="email" placeholder="Enter email address" required>
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" class="form-control" id="password" [(ngModel)]="credentials.password" name="password" placeholder="Enter password" required>
      </div>
      
      <button type="submit" role="button" class="btn btn-primary">Register</button>
    </form>
  </div>
