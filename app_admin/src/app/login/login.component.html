<div class="container mt-5">
  <h2 class="text-center">Login</h2>
  <form (ngSubmit)="login()" class="mt-4">
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" class="form-control" id="email" [(ngModel)]="credentials.email" name="email" placeholder="Enter your email" required />
    </div>

    <div class="form-group mt-3">
      <label for="password">Password</label>
      <input type="password" class="form-control" id="password" [(ngModel)]="credentials.password" name="password" placeholder="Enter your password" required />
    </div>

    <div *ngIf="formError" class="alert alert-danger mt-3">{{ formError }}</div> <!-- Display error message -->

    <button type="submit" class="btn btn-primary btn-block mt-4">Login</button>
  </form>
</div>
